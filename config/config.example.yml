# ALS multi-omics analysis config template.
# Copy this file to config/config.yml and edit local paths.
# Do not commit config/config.yml if it contains protected or local data paths.

project:
  base_dir: "/path/to/private/ALS"
  description: "Local private data root for the ALS multi-omics project"

outputs:
  root: "results"
  objects: "outputs/objects"
  logs: "logs"

transcriptomics:
  counts_csv: "transcriptomics/4_matrix/AnswerALS-651-T-v1-release6_raw-counts.csv"
  sample_map_csv: "transcriptomics/4_matrix/Sample_Mapping_Information/Sample_Mapping_File_Feb_2024.csv"
  clinical_csv: "metadata/clinical/aals_dataportal_datatable.csv"
  progression_csv: "ALS_Progression_Rates_Full.csv"
  mutation_subtypes_csv: "ALS_Mutation_Subtypes_with_ALS_Control.csv"
  nfl_csv: "answerals/NfL/NfL_Seimens_Atellica_Immunoassay_Proteomics_2022_07.csv"
  sod1_mutations_csv: "sod1_sample_mutations.csv"

proteomics:
  matrix_dir: "proteomics/4_matrix"
  corrected_imputed_matrix: "proteomics/4_matrix/AnswerALS-436-P_proteomics-protein-matrix_correctedImputed.txt"
  prebatch_corrected_matrix: "proteomics/4_matrix/AnswerALS-447-P_proteomics-protein-matrix_prebatchcorrected.txt"
  sample_map_csv: "proteomics/4_matrix/Sample_Mapping_Information/Sample_Mapping_File_Feb_2024.csv"
  guardrail_signature_csv: "results/transcriptomics/familial_signature_strict.csv"

genomics:
  exon_dir: "/path/to/annovar/exon/reports"
  af_table: "/path/to/all_chr_AF.txt"
  vcf_sample_ids: "/path/to/vcf_sample_ids.txt"
  gwas_dir: "/path/to/gwas/prset"
  van_rheenen_als_tsv: "/path/to/van_rheenen2021_als.tsv"

prs:
  prset_dir: "/path/to/prset/results"
  metabolic_best: "prset_axis_metabolic.best"
  cell_cycle_best: "prset_axis_cell_cycle.best"
  inflammation_best: "prset_axis_inflammation.best"

eqtl:
  cct2_eqtl_dir: "/path/to/cct2_eqtl"
  cct2_cis_dosage_raw: "cct2_cis_dosage.raw"

handoffs:
  axis_scoring: "outputs/objects/axis_scoring_objects.rds"
  sporadic_subtyping: "outputs/objects/sporadic_subtyping_objects.rds"
  genomic_burden: "outputs/objects/genomic_analysis_objects.rds"
  prset_testing: "outputs/objects/prset_testing_objects.rds"
