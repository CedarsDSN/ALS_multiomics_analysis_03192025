name: smoke-test

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  python-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Python syntax check
        run: python -m py_compile scripts/refactored/proteomics/04_sensitivity_analysis_prebatch.py

  r-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
      - name: R parse check only
        run: |
          Rscript -e 'files <- list.files("scripts/refactored", pattern="[.]R$", recursive=TRUE, full.names=TRUE); for (f in files) { message("Parsing ", f); parse(f) }'
